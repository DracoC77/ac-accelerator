[pytest]
# pytest configuration for Audio Chronicle Accelerator
#
# Unit tests in tests/ are discovered by default.
# E2E tests in tests/e2e/ are guarded by @pytest.mark.skipif(not ACCELERATOR_URL, ...)
# and are silently skipped unless ACCELERATOR_URL is set in the environment.

testpaths = tests
addopts = -v --tb=short
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Allow the custom e2e skip reason without warnings
markers =
    e2e: marks tests as end-to-end (deselect with '-m "not e2e"')
